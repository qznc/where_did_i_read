<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Where Did I Read</title>
        <style>
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    sans-serif;
                margin: 0;
                padding: 24px;
                width: 100%;
                min-height: 100vh;
                box-sizing: border-box;
                color: #1f2933;
                background: #f7f9fb;
            }
            h1 {
                font-size: 16px;
                margin: 0 0 8px;
            }
            .settings-link {
                float: right;
                font-size: 13px;
                font-weight: normal;
                color: #52606d;
                text-decoration: none;
            }
            .settings-link:hover {
                color: #1f2933;
                text-decoration: underline;
            }
            .row {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
            }
            input[type="search"] {
                flex: 1;
                padding: 6px 8px;
                border: 1px solid #cbd2d9;
                border-radius: 6px;
                font-size: 13px;
            }
            button {
                padding: 6px 10px;
                border: 1px solid #cbd2d9;
                background: #fff;
                border-radius: 6px;
                cursor: pointer;
                font-size: 12px;
            }
            button.primary {
                background: #2f80ed;
                border-color: #2f80ed;
                color: #fff;
            }
            .meta {
                font-size: 11px;
                color: #616e7c;
                margin-bottom: 6px;
            }
            ul {
                list-style: none;
                padding: 0;
                margin: 0;
                overflow: auto;
            }
            li {
                background: #fff;
                border: 1px solid #e4e7eb;
                border-radius: 8px;
                padding: 8px;
                margin-bottom: 8px;
            }
            .title {
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 4px;
                display: block;
            }
            .url {
                font-size: 11px;
                color: #52606d;
                word-break: break-all;
            }
            .time {
                font-size: 11px;
                color: #9aa5b1;
                margin-top: 4px;
            }
            .title-row {
                display: flex;
                align-items: baseline;
                gap: 6px;
            }
            .title-row .title {
                flex: 1;
                min-width: 0;
            }
            .delete-btn {
                flex-shrink: 0;
                background: none;
                border: none;
                color: #cbd2d9;
                font-size: 13px;
                cursor: pointer;
                padding: 2px 5px;
                border-radius: 4px;
                line-height: 1;
                opacity: 0;
                transition:
                    opacity 0.15s,
                    color 0.15s,
                    background 0.15s;
            }
            li:hover .delete-btn {
                opacity: 1;
            }
            .delete-btn:hover {
                color: #e12d39;
                background: #ffe3e3;
            }
            .empty {
                font-size: 12px;
                color: #616e7c;
                padding: 10px 0;
            }
            .ecosia-link {
                margin-left: 8px;
                font-size: 11px;
                color: #fff;
                background: #36a849;
                border-radius: 4px;
                padding: 2px 7px;
                text-decoration: none;
                white-space: nowrap;
            }
            .ecosia-link:hover {
                background: #2d8e3e;
            }
        </style>
    </head>
    <body>
        <h1>
            Where Did I Read
            <a class="settings-link" href="settings.html">⚙ Settings</a>
        </h1>
        <div class="row">
            <input id="query" type="search" placeholder="Search keywords..." />
        </div>
        <div class="meta">
            <span id="meta">Loading…</span> · Total: <span id="count">0</span> · Index: <span id="index-size">0</span>
            <a id="ecosia-link" class="ecosia-link" href="#" target="_blank" rel="noopener noreferrer" hidden
                >Search with Ecosia instead</a
            >
        </div>
        <ul id="results"></ul>

        <script src="flexsearch-loader.js" data-wdir-scripts="indexing.js,storage.js,constants.js,history.js"></script>
    </body>
</html>
