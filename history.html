<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Search My History</title>
        <style>
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    sans-serif;
                margin: 0;
                padding: 24px;
                width: 100%;
                min-height: 100vh;
                box-sizing: border-box;
                color: #1f2933;
                background: #f7f9fb;
            }
            h1 {
                font-size: 16px;
                margin: 0 0 8px;
            }
            .row {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
            }
            input[type="search"] {
                flex: 1;
                padding: 6px 8px;
                border: 1px solid #cbd2d9;
                border-radius: 6px;
                font-size: 13px;
            }
            button {
                padding: 6px 10px;
                border: 1px solid #cbd2d9;
                background: #fff;
                border-radius: 6px;
                cursor: pointer;
                font-size: 12px;
            }
            button.primary {
                background: #2f80ed;
                border-color: #2f80ed;
                color: #fff;
            }
            .meta {
                font-size: 11px;
                color: #616e7c;
                margin-bottom: 6px;
            }
            ul {
                list-style: none;
                padding: 0;
                margin: 0;
                overflow: auto;
            }
            li {
                background: #fff;
                border: 1px solid #e4e7eb;
                border-radius: 8px;
                padding: 8px;
                margin-bottom: 8px;
            }
            .title {
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 4px;
                display: block;
            }
            .url {
                font-size: 11px;
                color: #52606d;
                word-break: break-all;
            }
            .time {
                font-size: 11px;
                color: #9aa5b1;
                margin-top: 4px;
            }
            .empty {
                font-size: 12px;
                color: #616e7c;
                padding: 10px 0;
            }
        </style>
    </head>
    <body>
        <h1>Search My History</h1>
        <div class="row">
            <input id="query" type="search" placeholder="Search keywords..." />
        </div>
        <div class="meta">
            <span id="meta">Loading…</span> · Total: <span id="count">0</span> · Index: <span id="index-size">0</span>
        </div>
        <ul id="results"></ul>

        <script src="vendor/flexsearch.bundle.js"></script>
        <script src="indexing.js"></script>
        <script src="storage.js"></script>
        <script src="history.js"></script>
    </body>
</html>
